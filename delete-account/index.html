function changeLanguage(lang) {
  if (!Object.prototype.hasOwnProperty.call(pages, lang)) {
    lang = "en";
  }

  const data = pages[lang];

  document.documentElement.lang = lang;
  document.title = data.title + " | STUDIGO";

  document.getElementById("page-title").textContent = data.title;
  document.getElementById("page-subtitle").textContent = data.subtitle;
  document.getElementById("home-link").textContent = data.home;
  document.getElementById("privacy-link").textContent = data.privacy;

  document.getElementById("deletion-content").innerHTML =
    data.sections.map(section => `
      <section>
        <h2>${section.title}</h2>
        ${section.content}
      </section>
    `).join("");

  const footer = document.getElementById("footer-links");
  footer.textContent = "";

  const homeLink = document.createElement("a");
  homeLink.href = "../";
  homeLink.textContent = data.legal;

  const privacyLink = document.createElement("a");
  privacyLink.href = "../privacy-policy/";
  privacyLink.textContent = data.privacy;

  footer.append(homeLink, " · ", privacyLink);

  document.querySelectorAll(".lang-btn").forEach(button => {
    const active = button.dataset.lang === lang;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });

  try {
    localStorage.setItem("studigo_legal_language", lang);
  } catch (error) {
    // Language switching still works without browser storage.
  }
}

document.querySelectorAll(".lang-btn").forEach(button => {
  button.addEventListener("click", () => {
    changeLanguage(button.dataset.lang);
  });
});

let initialLanguage = "en";

try {
  const savedLanguage = localStorage.getItem("studigo_legal_language");
  if (savedLanguage && pages[savedLanguage]) {
    initialLanguage = savedLanguage;
  }
} catch (error) {
  // English is used if browser storage is unavailable.
}

changeLanguage(initialLanguage);
</script>
